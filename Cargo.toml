[workspace]
resolver = "2"
members = [
    "projects/bindings/sxo-types",
    "projects/dialects/sxo-dialect-mathematica",
    "projects/dialects/sxo-dialect-matlab",
    "projects/dialects/sxo-dialect-simple-math",
    "projects/dialects/sxo-dialect-pari-gp",
    "projects/adapters/sxo-adapter-apollo",
    "projects/bindings/sxo-napi",
    "projects/bindings/sxo-lite-wasm",
]
default-members = ["projects/dialects/sxo-dialect-mathematica"]

[workspace.package]
version = "0.0.4"
edition = "2021"
license = "Apache-2.0"
authors = ["SXO Contributors"]
repository = "https://github.com/ai4waifu/sxo-framework"
rust-version = "1.89"

[workspace.dependencies]
sxo-types = { path = "projects/bindings/sxo-types" }
sxo-dialect-mathematica = { path = "projects/dialects/sxo-dialect-mathematica" }
sxo-dialect-matlab = { path = "projects/dialects/sxo-dialect-matlab" }
sxo-dialect-simple-math = { path = "projects/dialects/sxo-dialect-simple-math" }
sxo-dialect-pari-gp = { path = "projects/dialects/sxo-dialect-pari-gp" }
sxo-adapter-apollo = { path = "projects/adapters/sxo-adapter-apollo" }
napi = { version = "3.12.1", default-features = true, features = ["napi4"] }
napi-derive = "3.6.3"
wasm-bindgen = "0.2"
# Local workspace pins while parser / result-contract work lands. CI tip: switch back to git rev after push.
oak-core = { path = "../oaks/projects/oak-core", default-features = false }
oak-wolfram = { path = "../oaks/examples/oak-wolfram", default-features = false }
oak-matlab = { path = "../oaks/examples/oak-matlab", default-features = false }
# Local workspace pin while Athena result-contract work lands. CI tip: replace with git rev after push.
athena = { path = "../athena.rs/projects/athena", package = "athena" }
athena-types = { path = "../athena.rs/projects/athena-types", package = "athena-types" }
apollo = { git = "https://github.com/ai4waifu/apollo.rs.git", rev = "6af6f73ae6289d69d076004d34b432eef052e1c0", package = "apollo", default-features = true }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_code = "warn"
