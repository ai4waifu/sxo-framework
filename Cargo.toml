[workspace]
resolver = "2"
members = [
    "projects/compilers/sxo-types",
    "projects/compilers/sxo-dialect-mathematica",
    "projects/compilers/sxo-dialect-matlab",
    "projects/compilers/sxo-dialect-simple-math",
    "projects/compilers/sxo-adapter-apollo",
    "projects/compilers/sxo-napi",
    "projects/compilers/sxo-lite-wasm",
]
default-members = ["projects/compilers/sxo-dialect-mathematica"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
authors = ["SXO Contributors"]
repository = "https://github.com/ai4waifu/sxo-framework"
rust-version = "1.89"

[workspace.dependencies]
sxo-types = { path = "projects/compilers/sxo-types" }
sxo-dialect-mathematica = { path = "projects/compilers/sxo-dialect-mathematica" }
sxo-dialect-matlab = { path = "projects/compilers/sxo-dialect-matlab" }
sxo-dialect-simple-math = { path = "projects/compilers/sxo-dialect-simple-math" }
sxo-adapter-apollo = { path = "projects/compilers/sxo-adapter-apollo" }
napi = { version = "3.12.1", default-features = true, features = ["napi4"] }
napi-derive = "3.6.3"
wasm-bindgen = "0.2"
oak-core = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", default-features = false }
oak-wolfram = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", default-features = false }
oak-matlab = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", default-features = false }
athena = { git = "https://github.com/ai4waifu/athena.rs.git", rev = "95c8ea2562a10627606e1005bb1c97f3007389d2", package = "athena" }
athena-types = { git = "https://github.com/ai4waifu/athena.rs.git", rev = "95c8ea2562a10627606e1005bb1c97f3007389d2", package = "athena-types" }
athena-ir = { git = "https://github.com/ai4waifu/athena.rs.git", rev = "95c8ea2562a10627606e1005bb1c97f3007389d2", package = "athena-ir" }
apollo = { git = "https://github.com/ai4waifu/apollo.rs.git", rev = "6af6f73ae6289d69d076004d34b432eef052e1c0", package = "apollo", default-features = true }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = "0.2"
num-integer = "0.1"
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_code = "warn"
