[package]
name = "sxo-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "N-API bridge: Node.js ↔ SXO SxoFrontend"
publish = false

[lib]
crate-type = ["cdylib"]
name = "sxo_napi"

[lints]
workspace = true

[dependencies]
sxo-dialects = { workspace = true }
napi.workspace = true
napi-derive.workspace = true
zeromq = { version = "0.4", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
napi-build = "2"
