[package]
name = "sxo-lite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM ABI bridge (Session + dialect crates)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "sxo_lite"

[lints]
workspace = true

[dependencies]
athena = { workspace = true }
sxo-types = { workspace = true }
sxo-dialect-mathematica = { workspace = true }
sxo-dialect-matlab = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# Both major lines appear in the graph (`rand` → 0.3, direct → 0.4). Feature alone is not enough — also see `.cargo/config.toml`.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
